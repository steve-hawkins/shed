version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/.devcontainer/base"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "mcr.microsoft.com/devcontainers/dotnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/infra/factory-observability"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
