name: Control Plane Path Guard

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  path-guard:
    name: path-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out base & head for diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block unauthorized edits to control-plane files
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          # Define protected control-plane paths
          PROTECTED_REGEX='^(\.github/|\.devcontainer/|\.agents/|infra/factory-observability/|\.semgrep\.yml$|stryker-config\.json$|AGENTS\.md$|docs/FACTORY_ARCHITECTURE\.md$)'

          # Find any modified, added, or deleted files matching protected paths
          CHANGED_PROTECTED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E "$PROTECTED_REGEX" || true)

          if [ -z "$CHANGED_PROTECTED" ]; then
            echo "No protected control-plane files were modified."
            exit 0
          fi

          echo "Protected files modified:"
          echo "$CHANGED_PROTECTED"

          # 1. Human repository owner has full control-plane access
          if [ "$PR_AUTHOR" = "steve-hawkins" ] && [ "$TRIGGER_ACTOR" = "steve-hawkins" ]; then
            echo "Authorized human actor verified (PR author: $PR_AUTHOR, trigger actor: $TRIGGER_ACTOR)."
            exit 0
          fi

          # 2. Allow Dependabot ONLY for dependency-managed files configured in .github/dependabot.yml
          DEPENDABOT_ALLOWED_REGEX='^(\.github/workflows/[^/]+\.ya?ml$|\.devcontainer/base/.*Dockerfile[^/]*$|infra/factory-observability/(docker-)?compose[^/]*\.ya?ml$)'

          if [ "$PR_AUTHOR" = "dependabot[bot]" ] \
            && { [ -z "$PR_AUTHOR_ID" ] || [ "$PR_AUTHOR_ID" = "49699333" ]; } \
            && { [ "$TRIGGER_ACTOR" = "dependabot[bot]" ] || [ "$TRIGGER_ACTOR" = "steve-hawkins" ]; }; then

            DISALLOWED=$(echo "$CHANGED_PROTECTED" | grep -Ev "$DEPENDABOT_ALLOWED_REGEX" || true)
            if [ -n "$DISALLOWED" ]; then
              echo "::error::Dependabot PR modifies control-plane files outside its allowed scope:"
              echo "$DISALLOWED"
              exit 1
            fi

            # Verify every commit on the PR is a verified Dependabot commit or authored by steve-hawkins
            if [ -n "$PR_NUMBER" ]; then
              BAD_COMMITS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
                --jq '.[] | select(
                  (.author.login != "dependabot[bot]" and .author.login != "steve-hawkins") or
                  (.author.login == "dependabot[bot]" and .commit.verification.verified != true)
                ) | "\(.sha) (author: \(.author.login // "unknown"), verified: \(.commit.verification.verified))"')

              if [ -n "$BAD_COMMITS" ]; then
                echo "::error::Dependabot PR contains unverified or unauthorized commits:"
                echo "$BAD_COMMITS"
                exit 1
              fi
            fi

            echo "Authorized Dependabot update to dependency-managed control-plane files."
            exit 0
          fi

          echo "::error::Unauthorized control-plane modification (PR author: '$PR_AUTHOR', trigger actor: '$TRIGGER_ACTOR')."
          exit 1
